<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="App de previsibilidade financeira - Projeção de fluxo de caixa">
    <title>{% block title %}Finança{% endblock %} | Previsão Financeira</title>

    <!-- Tema (aplica antes da pintura para evitar flash) -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                var root = document.documentElement;
                if (t === 'light') {
                    root.classList.add('light');
                    root.classList.remove('dark');
                } else {
                    root.classList.add('dark');
                    root.classList.remove('light');
                }
            } catch (e) {}
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            900: 'rgb(var(--c-dark-900) / <alpha-value>)',
                            800: 'rgb(var(--c-dark-800) / <alpha-value>)',
                            700: 'rgb(var(--c-dark-700) / <alpha-value>)',
                            600: 'rgb(var(--c-dark-600) / <alpha-value>)',
                            500: 'rgb(var(--c-dark-500) / <alpha-value>)',
                        },
                        accent: {
                            DEFAULT: '#fcd535',
                            light: '#f0b90b',
                            dark: '#3a3a1f',
                        },
                        income: '#0ecb81',
                        expense: '#f6465d',
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/custom.css' %}?v=5">

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark-900 text-gray-100 font-sans antialiased min-h-screen flex flex-col md:flex-row"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <!-- Mobile Top Header -->
    <header class="fixed top-0 left-0 right-0 h-16 md:hidden flex items-center justify-between px-4 z-40 bg-dark-900 border-b border-dark-700">
        <!-- Logo -->
        <a href="{% url 'dashboard' %}" class="flex items-center gap-3 group">
            <div class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center">
                <svg class="w-4 h-4 text-dark-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                </svg>
            </div>
            <span class="text-md font-bold text-white">Finança</span>
        </a>

        <!-- Hamburguer Button -->
        <button id="mobile-menu-btn" class="p-2 rounded-lg hover:bg-white/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
    </header>

    <!-- Botão para abrir sidebar no Desktop quando recolhida -->
    <button id="sidebar-open-btn" class="hidden fixed top-4 left-4 z-30 items-center justify-center p-2.5 rounded-xl bg-dark-800 border border-dark-700 text-gray-400 hover:text-white shadow-lg transition-all duration-300 hover:scale-105" title="Mostrar menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
        </svg>
    </button>

    <!-- Sidebar overlay for Mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity duration-300"></div>

    <!-- Responsive Sidebar -->
    <aside id="sidebar" class="fixed top-0 right-0 md:right-auto md:left-0 bottom-0 z-50 w-64 bg-dark-800 border-l md:border-l-0 md:border-r border-dark-700 flex flex-col justify-between transform translate-x-full transition-all duration-300 ease-in-out">
        <div class="flex flex-col">
            <!-- Header/Logo area -->
            <div class="h-16 flex items-center justify-between px-6 border-b border-dark-700">
                <a href="{% url 'dashboard' %}" class="flex items-center gap-3 group">
                    <div class="w-9 h-9 rounded-xl bg-accent flex items-center justify-center">
                        <svg class="w-5 h-5 text-dark-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                        </svg>
                    </div>
                    <span class="text-lg font-bold text-white">Finança</span>
                </a>

                <!-- Botão de fechar (funciona tanto no mobile quanto no desktop) -->
                <button id="sidebar-close-btn" class="p-2 rounded-lg hover:bg-white/5 text-gray-400 hover:text-white transition-colors" title="Esconder menu">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path class="hidden md:block" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
                        <path class="md:hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Navigation Links (Tailwind nativo para evitar cache e garantir alinhamento perfeito) -->
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 {% if request.resolver_match.url_name == 'dashboard' %}text-white bg-yellow-400/10 border-l-4 border-yellow-400 pl-3{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>

                <a href="{% url 'transaction_list' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 {% if request.resolver_match.url_name == 'transaction_list' %}text-white bg-yellow-400/10 border-l-4 border-yellow-400 pl-3{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    Transações
                </a>
                <a href="{% url 'recurring_list' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 {% if request.resolver_match.url_name == 'recurring_list' %}text-white bg-yellow-400/10 border-l-4 border-yellow-400 pl-3{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                    Lançamentos
                </a>
                <a href="{% url 'card_list' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 {% if request.resolver_match.url_name == 'card_list' %}text-white bg-yellow-400/10 border-l-4 border-yellow-400 pl-3{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                    Cartões
                </a>
                <a href="{% url 'goal_list' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 {% if request.resolver_match.url_name == 'goal_list' %}text-white bg-yellow-400/10 border-l-4 border-yellow-400 pl-3{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                    Metas
                </a>
                <a href="{% url 'settings' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 {% if request.resolver_match.url_name == 'settings' %}text-white bg-yellow-400/10 border-l-4 border-yellow-400 pl-3{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Config
                </a>
            </nav>
        </div>

        <div class="px-5 py-4 border-t border-dark-700 space-y-2">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full bg-yellow-400/20 flex items-center justify-center text-yellow-400 text-xs font-bold shrink-0">
                    {{ request.user.username|first|upper }}
                </div>
                <span class="text-sm text-gray-300 truncate">{{ request.user.username }}</span>
            </div>

            <!-- Alternar tema claro/escuro -->
            <button type="button" id="theme-toggle" onclick="toggleTheme()"
                    class="flex items-center gap-2 w-full py-1.5 px-2 -mx-2 rounded-lg text-xs text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                <span class="theme-to-light flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    Modo claro
                </span>
                <span class="theme-to-dark items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                    Modo escuro
                </span>
            </button>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="flex items-center gap-2 text-xs text-gray-500 hover:text-red-400 transition-colors w-full">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Sair
                </button>
            </form>
            <p class="text-xs text-gray-600 text-center">v1.3.0</p>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div id="main-content-container" class="flex-1 flex flex-col md:pl-64 min-h-screen w-full transition-all duration-300 ease-in-out">
        <main class="flex-1 pt-20 md:pt-10 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast notifications (HTMX) -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- Container Global para Modais -->
    <div id="global-modal"></div>

    <script>
        (function() {
            function showToast(message, level) {
                const container = document.getElementById('toast-container');
                if (!container || !message) return;

                const tone = level === 'error'
                    ? 'border-red-400/40 bg-red-500/10 text-red-100'
                    : 'border-emerald-400/40 bg-emerald-500/10 text-emerald-100';

                const toast = document.createElement('div');
                toast.className = `min-w-[280px] max-w-sm rounded-lg border px-5 py-4 text-base font-medium shadow-xl backdrop-blur ${tone}`;
                toast.textContent = message;
                container.appendChild(toast);

                setTimeout(() => {
                    toast.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                    setTimeout(() => toast.remove(), 300);
                }, 5000);
            }

            document.body.addEventListener('showToast', function(event) {
                const detail = event.detail || {};
                showToast(detail.message, detail.level);
            });

            window.showToast = showToast;
        })();

        document.body.addEventListener('htmx:responseError', function(evt) {
            var status = evt.detail.xhr ? evt.detail.xhr.status : 0;
            var msg = status >= 500
                ? 'Erro interno do servidor. Tente novamente.'
                : 'Ocorreu um erro (' + status + '). Verifique os dados e tente novamente.';
            if (window.showToast) window.showToast(msg, 'error');
        });

        document.body.addEventListener('htmx:sendError', function() {
            if (window.showToast) window.showToast('Falha na conexão. Verifique sua internet.', 'error');
        });

        window.closeGlobalModal = function() {
            const modal = document.getElementById('global-modal');
            if (modal) {
                modal.innerHTML = '';
            }
        };

        window.toggleTheme = function() {
            const root = document.documentElement;
            const isLight = root.classList.toggle('light');
            root.classList.toggle('dark', !isLight);
            try { localStorage.setItem('theme', isLight ? 'light' : 'dark'); } catch (e) {}
        };

        function setupDatePickers() {
            document.querySelectorAll('.date-picker-wrap').forEach(wrap => {
                if (wrap.dataset.enhanced === 'true') return;

                const input = wrap.querySelector('input');
                const panel = wrap.querySelector('[data-date-panel]');
                const toggle = wrap.querySelector('[data-date-toggle]');
                const title = wrap.querySelector('[data-date-title]');
                const grid = wrap.querySelector('[data-date-grid]');
                const prev = wrap.querySelector('[data-date-prev]');
                const next = wrap.querySelector('[data-date-next]');

                if (!input || !panel || !toggle || !title || !grid || !prev || !next) return;

                input.setAttribute('maxlength', '10');
                input.setAttribute('placeholder', 'dd/mm/aaaa');

                const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
                const today = new Date();
                const minDate = new Date(today.getFullYear() - 1, today.getMonth(), today.getDate());

                function formatBR(date) {
                    const dd = String(date.getDate()).padStart(2, '0');
                    const mm = String(date.getMonth() + 1).padStart(2, '0');
                    const yyyy = date.getFullYear();
                    return dd + '/' + mm + '/' + yyyy;
                }

                function parseDate(raw) {
                    if (!raw) return null;
                    const value = raw.trim();
                    let match = value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                    if (match) {
                        const day = Number(match[1]);
                        const month = Number(match[2]) - 1;
                        const year = Number(match[3]);
                        const parsed = new Date(year, month, day);
                        return parsed.getFullYear() === year && parsed.getMonth() === month && parsed.getDate() === day ? parsed : null;
                    }

                    match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
                    if (match) {
                        const year = Number(match[1]);
                        const month = Number(match[2]) - 1;
                        const day = Number(match[3]);
                        const parsed = new Date(year, month, day);
                        return parsed.getFullYear() === year && parsed.getMonth() === month && parsed.getDate() === day ? parsed : null;
                    }

                    return null;
                }

                function isSameDate(a, b) {
                    return a && b && a.getDate() === b.getDate() && a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear();
                }

                let selectedDate = parseDate(input.value) || today;
                input.value = formatBR(selectedDate);
                let viewYear = selectedDate.getFullYear();
                let viewMonth = selectedDate.getMonth();

                function renderCalendar() {
                    title.textContent = months[viewMonth] + ' ' + viewYear;
                    grid.innerHTML = '';

                    const monthStart = new Date(viewYear, viewMonth, 1);
                    const monthEnd = new Date(viewYear, viewMonth + 1, 0);
                    const firstWeekday = monthStart.getDay();
                    const daysInMonth = monthEnd.getDate();
                    const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();

                    for (let i = firstWeekday - 1; i >= 0; i -= 1) {
                        const day = document.createElement('button');
                        day.type = 'button';
                        day.className = 'date-picker-day is-outside';
                        day.textContent = String(prevMonthDays - i);
                        day.disabled = true;
                        grid.appendChild(day);
                    }

                    for (let d = 1; d <= daysInMonth; d += 1) {
                        const current = new Date(viewYear, viewMonth, d);
                        const day = document.createElement('button');
                        day.type = 'button';
                        day.className = 'date-picker-day';
                        day.textContent = String(d);

                        if (isSameDate(current, today)) day.classList.add('is-today');
                        if (isSameDate(current, selectedDate)) day.classList.add('is-selected');

                        if (current < minDate) {
                            day.disabled = true;
                            day.classList.add('is-disabled');
                        } else {
                            day.addEventListener('click', function() {
                                selectedDate = current;
                                input.value = formatBR(current);
                                panel.classList.add('hidden');
                                renderCalendar();
                                input.dispatchEvent(new Event('input', { bubbles: true }));
                                input.dispatchEvent(new Event('change', { bubbles: true }));
                            });
                        }

                        grid.appendChild(day);
                    }

                    const totalCells = firstWeekday + daysInMonth;
                    const trailing = (7 - (totalCells % 7)) % 7;
                    for (let t = 1; t <= trailing; t += 1) {
                        const day = document.createElement('button');
                        day.type = 'button';
                        day.className = 'date-picker-day is-outside';
                        day.textContent = String(t);
                        day.disabled = true;
                        grid.appendChild(day);
                    }
                }

                function syncFromInput() {
                    const parsed = parseDate(input.value);
                    if (!parsed) return;
                    if (parsed < minDate) {
                        selectedDate = minDate;
                        viewMonth = minDate.getMonth();
                        viewYear  = minDate.getFullYear();
                        input.value = formatBR(minDate);
                        renderCalendar();
                        return;
                    }
                    selectedDate = parsed;
                    viewMonth = parsed.getMonth();
                    viewYear = parsed.getFullYear();
                    input.value = formatBR(parsed);
                    renderCalendar();
                }

                toggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    panel.classList.toggle('hidden');
                    syncFromInput();
                });

                input.addEventListener('focus', function() {
                    panel.classList.remove('hidden');
                    syncFromInput();
                    setTimeout(function() { input.select(); }, 0);
                });

                input.addEventListener('click', function() {
                    input.select();
                });

                input.addEventListener('blur', function() {
                    setTimeout(syncFromInput, 120);
                });

                input.addEventListener('input', function() {
                    const onlyDigits = input.value.replace(/\D/g, '').slice(0, 8);
                    let masked = onlyDigits;
                    if (onlyDigits.length > 2) masked = onlyDigits.slice(0, 2) + '/' + onlyDigits.slice(2);
                    if (onlyDigits.length > 4) masked = onlyDigits.slice(0, 2) + '/' + onlyDigits.slice(2, 4) + '/' + onlyDigits.slice(4);
                    input.value = masked;
                });

                prev.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const prevMonth = viewMonth === 0 ? 11 : viewMonth - 1;
                    const prevYear  = viewMonth === 0 ? viewYear - 1 : viewYear;
                    if (prevYear < minDate.getFullYear() ||
                        (prevYear === minDate.getFullYear() && prevMonth < minDate.getMonth())) return;
                    viewMonth = prevMonth;
                    viewYear  = prevYear;
                    renderCalendar();
                });

                next.addEventListener('click', function(e) {
                    e.stopPropagation();
                    viewMonth += 1;
                    if (viewMonth > 11) {
                        viewMonth = 0;
                        viewYear += 1;
                    }
                    renderCalendar();
                });

                document.addEventListener('click', function(event) {
                    if (!wrap.contains(event.target)) {
                        panel.classList.add('hidden');
                    }
                });

                wrap.dataset.enhanced = 'true';
                renderCalendar();
            });
        }

        document.addEventListener('DOMContentLoaded', setupDatePickers);
        document.body.addEventListener('htmx:afterSettle', setupDatePickers);

        function setupAmountInputs() {
            document.querySelectorAll('.amount-input').forEach(function(el) {
                if (el.dataset.amountMask) return;
                el.dataset.amountMask = '1';

                // Parse valor inicial do servidor (ex: "150.50" ou "1500.00")
                var cents = 0;
                var raw = el.value.trim().replace(/R\$\s*/i, '').replace(/\./g, '').replace(',', '.');
                var parsed = parseFloat(raw);
                if (!isNaN(parsed) && parsed > 0) {
                    cents = Math.round(parsed * 100);
                }

                function fmtCents(c) {
                    if (c === 0) return '';
                    var s = String(c).padStart(3, '0');
                    var intPart = s.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                    return 'R$ ' + intPart + ',' + s.slice(-2);
                }

                el.value = fmtCents(cents);
                el.placeholder = 'R$ 0,00';

                el.addEventListener('keydown', function(e) {
                    var digit = -1;
                    if (e.keyCode >= 96 && e.keyCode <= 105 && !e.shiftKey) digit = e.keyCode - 96;
                    else if (e.keyCode >= 48 && e.keyCode <= 57 && !e.shiftKey) digit = e.keyCode - 48;

                    if (digit !== -1) {
                        e.preventDefault();
                        if (cents < 99999999) { // limite R$ 999.999,99
                            cents = cents * 10 + digit;
                        }
                        el.value = fmtCents(cents);
                        return;
                    }
                    if (e.keyCode === 8) { // Backspace
                        e.preventDefault();
                        cents = Math.floor(cents / 10);
                        el.value = fmtCents(cents);
                        return;
                    }
                    if (e.keyCode === 46) { // Delete
                        e.preventDefault();
                        cents = 0;
                        el.value = '';
                        return;
                    }
                    // Permite Tab, Escape, Enter, setas
                    if ([9, 13, 27, 37, 38, 39, 40].indexOf(e.keyCode) !== -1) return;
                    if (e.ctrlKey || e.metaKey) return;
                    e.preventDefault();
                });

                el.addEventListener('paste', function(e) {
                    e.preventDefault();
                    var text = (e.clipboardData || window.clipboardData).getData('text');
                    var cleaned = text.replace(/R\$\s*/i, '').replace(/\./g, '').replace(',', '.').trim();
                    var p = parseFloat(cleaned);
                    if (!isNaN(p) && p >= 0) {
                        cents = Math.round(p * 100);
                        el.value = fmtCents(cents);
                    }
                });

                // Não permite clicar e editar o texto diretamente
                el.addEventListener('click', function() {
                    el.setSelectionRange(el.value.length, el.value.length);
                });
            });
        }

        function setupDescriptionCounters() {
            document.querySelectorAll('input[data-char-counter]').forEach(function(el) {
                if (el.dataset.counterInit) return;
                el.dataset.counterInit = '1';
                var max = parseInt(el.dataset.charCounter, 10);
                var span = document.createElement('span');
                span.className = 'char-counter hidden text-[10px] text-gray-600 float-right mt-0.5 transition-colors duration-150';
                el.parentNode.insertBefore(span, el.nextSibling);

                function update() {
                    var rem = max - el.value.length;
                    span.textContent = rem + '/' + max;
                    span.classList.toggle('text-red-400', rem <= 20);
                    span.classList.toggle('text-gray-600', rem > 20);
                }

                el.addEventListener('focus', function() {
                    update();
                    span.classList.remove('hidden');
                });
                el.addEventListener('input', update);
                el.addEventListener('blur', function() {
                    span.classList.add('hidden');
                });
            });
        }

        document.addEventListener('DOMContentLoaded', setupAmountInputs);
        document.body.addEventListener('htmx:afterSettle', setupAmountInputs);
        document.addEventListener('DOMContentLoaded', setupDescriptionCounters);
        document.body.addEventListener('htmx:afterSettle', setupDescriptionCounters);

        // Gerenciamento da Sidebar responsiva (Mobile) e Colapsável (Desktop)
        (function() {
            const btn = document.getElementById('mobile-menu-btn');
            const closeBtn = document.getElementById('sidebar-close-btn');
            const openBtn = document.getElementById('sidebar-open-btn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const mainContent = document.getElementById('main-content-container');

            if (!sidebar || !overlay || !mainContent) return;

            // Helpers para limpar classes de translate conflitantes
            function hideClean() {
                sidebar.classList.remove('translate-x-full', '-translate-x-full');
            }

            // ─── Desktop (sidebar à esquerda) ───────────────────
            function collapseSidebar() {
                hideClean();
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                mainContent.classList.remove('md:pl-64');
                mainContent.classList.add('md:pl-0');
                if (openBtn) {
                    openBtn.classList.remove('hidden');
                    openBtn.style.display = 'flex';
                }
                localStorage.setItem('sidebar-collapsed', 'true');
            }

            function expandSidebar() {
                hideClean();
                // Sem classe de translate = sidebar visível
                mainContent.classList.remove('md:pl-0');
                mainContent.classList.add('md:pl-64');
                if (openBtn) {
                    openBtn.classList.add('hidden');
                    openBtn.style.display = '';
                }
                localStorage.setItem('sidebar-collapsed', 'false');
            }

            // ─── Mobile (sidebar à direita) ─────────────────────
            function openMobile() {
                hideClean();
                overlay.classList.remove('hidden');
            }

            function closeMobile() {
                hideClean();
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }

            // ─── Inicialização ──────────────────────────────────
            function initSidebar() {
                // Desabilita transição para não animar no carregamento da página
                sidebar.style.transition = 'none';
                mainContent.style.transition = 'none';

                var isMobile = window.innerWidth < 768;
                if (isMobile) {
                    closeMobile();
                    mainContent.classList.remove('md:pl-64');
                    mainContent.classList.add('md:pl-0');
                    if (openBtn) { openBtn.classList.add('hidden'); openBtn.style.display = ''; }
                } else {
                    var isCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';
                    if (isCollapsed) {
                        collapseSidebar();
                    } else {
                        expandSidebar();
                    }
                }

                // Reabilita transição após o layout ser aplicado
                requestAnimationFrame(function() {
                    requestAnimationFrame(function() {
                        sidebar.style.transition = '';
                        mainContent.style.transition = '';
                    });
                });
            }

            // ─── Listeners ──────────────────────────────────────
            if (btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openMobile();
                });
            }

            if (closeBtn) {
                closeBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (window.innerWidth < 768) {
                        closeMobile();
                    } else {
                        collapseSidebar();
                    }
                });
            }

            if (openBtn) {
                openBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    expandSidebar();
                });
            }

            overlay.addEventListener('click', function() {
                closeMobile();
            });

            document.body.addEventListener('htmx:afterSwap', function() {
                if (window.innerWidth < 768) {
                    closeMobile();
                }
            });

            // Fechar modal global ao deletar com sucesso (apenas POSTs, não GETs de confirm)
            document.body.addEventListener('htmx:afterRequest', function(evt) {
                const xhr = evt.detail.xhr;
                const config = evt.detail.requestConfig;
                if (xhr && xhr.status === 200 && config && config.path && config.verb === 'post') {
                    if (config.path.includes('/delete/')) {
                        closeGlobalModal();
                    }
                }
            });

            // Fechar modal global ao disparar atualização
            document.body.addEventListener('transactionUpdated', function() {
                closeGlobalModal();
            });

            initSidebar();
            window.addEventListener('resize', initSidebar);
        })();
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
