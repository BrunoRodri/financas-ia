{% load currency_filters %}
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[105] flex items-center justify-center animate-fade-in pointer-events-auto"
     id="scope-modal-overlay"
     onclick="if(event.target === this) this.remove()">
    <div class="bg-dark-800 border border-white/10 rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl space-y-5 animate-scale-up">

        <!-- Header -->
        <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-lg bg-accent/10 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-accent-light" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
            </div>
            <div>
                <h3 class="text-lg font-bold text-white">Editar parcela</h3>
                <p class="text-sm text-gray-400 mt-0.5">
                    {{ txn.description }}
                    <span class="text-gray-600 ml-1">{{ txn.installment_number }}/{{ txn.recurring_rule.total_installments }}</span>
                </p>
            </div>
        </div>

        <!-- Pergunta -->
        <p class="text-sm text-gray-400">O que deseja editar?</p>

        <!-- Opções -->
        <div class="flex flex-col gap-2 pt-1">
            <!-- Só esta parcela: fecha modal e carrega form inline na linha -->
            <button hx-get="{% url 'transaction_edit' txn.id %}"
                    hx-target="#txn-{{ txn.id }}"
                    hx-swap="outerHTML"
                    onclick="document.getElementById('scope-modal-overlay').remove()"
                    class="w-full py-2.5 rounded-xl text-sm font-semibold bg-accent hover:bg-accent-light text-white transition-all shadow-md shadow-accent/20 active:scale-[0.98]">
                Só esta parcela
                <span class="text-xs font-normal opacity-70 ml-1">({{ txn.installment_number }}/{{ txn.recurring_rule.total_installments }})</span>
            </button>

            <!-- Todas as parcelas: substitui este modal pelo modal de edição da regra -->
            <button hx-get="{% url 'recurring_edit' txn.recurring_rule.id %}"
                    hx-target="#global-modal"
                    hx-swap="innerHTML"
                    class="w-full py-2.5 rounded-xl text-sm font-semibold bg-white/5 hover:bg-white/10 text-gray-300 transition-colors active:scale-[0.98]">
                Todas as parcelas
                <span class="text-xs font-normal opacity-60 ml-1">({{ txn.recurring_rule.total_installments }} no total)</span>
            </button>

            <button type="button"
                    onclick="document.getElementById('scope-modal-overlay').remove()"
                    class="w-full py-2 rounded-xl text-sm text-gray-500 hover:text-gray-300 transition-colors text-center">
                Cancelar
            </button>
        </div>
    </div>
</div>
