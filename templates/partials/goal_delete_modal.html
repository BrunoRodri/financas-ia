{% load currency_filters %}
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[105] flex items-center justify-center animate-fade-in pointer-events-auto" id="delete-modal-overlay" onclick="if(event.target === this) this.remove()">
    <!-- Modal Dialog -->
    <div class="bg-dark-800 border border-white/10 rounded-2xl p-6 max-w-md w-full mx-4 shadow-2xl space-y-5 animate-scale-up">
        
        <!-- Header -->
        <div class="flex items-start gap-3 text-red-400">
            <div class="w-10 h-10 rounded-lg bg-red-500/10 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </div>
            <div>
                <h3 class="text-lg font-bold text-white">Excluir Meta Financeira</h3>
                <p class="text-sm text-gray-400 mt-1">Meta: <span class="text-white font-medium">{{ goal.name }}</span></p>
            </div>
        </div>

        <!-- Body -->
        <div class="text-sm text-gray-300 space-y-3 leading-relaxed">
            <p>Tem certeza de que deseja excluir esta meta financeira e todo o seu progresso acumulado?</p>
            <div class="p-3 rounded-lg bg-white/5 border border-white/10 text-gray-400 flex justify-between items-center">
                <span class="text-xs">Progresso:</span>
                <span class="font-bold text-white text-sm" style="color: {{ goal.color }};">{{ goal.progress_percent|percentage }} ({{ goal.current_amount|brl }} de {{ goal.target_amount|brl }})</span>
            </div>
        </div>

        <!-- Footer / Actions -->
        <div class="flex flex-col gap-2 pt-2">
            <button hx-post="{% url 'goal_delete' goal.id %}"
                    hx-target="#goal-card-{{ goal.id }}"
                    hx-swap="outerHTML"
                    hx-on::after-request="const overlay = document.getElementById('delete-modal-overlay'); if(overlay) overlay.remove()"
                    class="w-full py-2.5 rounded-xl text-sm font-semibold bg-red-600 hover:bg-red-500 text-white transition-all shadow-md shadow-red-600/10 active:scale-[0.98] cursor-pointer">
                Sim, excluir meta
            </button>
            
            <button type="button" 
                    onclick="this.closest('#delete-modal-overlay').remove()"
                    class="w-full py-2.5 rounded-xl text-sm font-semibold bg-white/5 hover:bg-white/10 text-gray-300 transition-colors text-center cursor-pointer">
                Cancelar
            </button>
        </div>
    </div>
</div>
