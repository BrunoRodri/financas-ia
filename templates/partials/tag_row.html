<div id="tag-{{ tag.id }}" class="flex items-center justify-between p-2 rounded-lg bg-white/5 border border-white/5 hover:border-white/10 transition-all animate-fade-in-up">
    <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: {{ tag.color }};"></span>
        <span class="text-sm font-medium text-white truncate max-w-[180px]">{{ tag.name }}</span>
    </div>
    <button hx-post="{% url 'tag_delete' tag.id %}"
            hx-target="#tag-{{ tag.id }}"
            hx-swap="outerHTML"
            hx-confirm="Deseja excluir a categoria '{{ tag.name }}'?"
            class="p-1 rounded-md hover:bg-red-500/10 text-gray-500 hover:text-red-400 transition-colors"
            title="Excluir Categoria">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
    </button>
</div>
