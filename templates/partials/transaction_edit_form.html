{% load currency_filters %}
<div id="txn-{{ txn.id }}" class="rounded-xl border border-accent/30 bg-dark-800/60 p-4 animate-fade-in-up">
    <form hx-post="{% url 'transaction_edit' txn.id %}"
          hx-target="#txn-{{ txn.id }}"
          hx-swap="outerHTML"
          class="space-y-3">
        {% csrf_token %}

        <!-- Descrição -->
        <div>
            <label class="form-label text-xs" for="edit_description_{{ txn.id }}">Descrição</label>
            <input type="text" name="description" id="edit_description_{{ txn.id }}"
                   value="{{ txn.description }}"
                   class="form-input w-full" required>
        </div>

        <!-- Valor + Tipo -->
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="form-label text-xs" for="edit_amount_{{ txn.id }}">Valor (R$)</label>
                <input type="number" name="amount" id="edit_amount_{{ txn.id }}"
                       value="{{ txn.amount|stringformat:'.2f' }}"
                       step="0.01" min="0.01"
                       class="form-input w-full" required>
            </div>
            <div>
                <label class="form-label text-xs" for="edit_type_{{ txn.id }}">Tipo</label>
                <select name="type" id="edit_type_{{ txn.id }}" class="form-select w-full">
                    <option value="INCOME" {% if txn.type == 'INCOME' %}selected{% endif %}>Entrada</option>
                    <option value="EXPENSE" {% if txn.type == 'EXPENSE' %}selected{% endif %}>Saída</option>
                </select>
            </div>
        </div>

        <!-- Data + Status -->
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="form-label text-xs" for="edit_due_date_{{ txn.id }}">Data</label>
                <div class="date-picker-wrap">
                    <input type="text" name="due_date" id="edit_due_date_{{ txn.id }}"
                           value="{{ txn.due_date|date:'d/m/Y' }}"
                           class="form-input w-full" autocomplete="off" inputmode="numeric" required>
                    <button type="button" class="date-picker-toggle" aria-label="Abrir calendário" data-date-toggle>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    </button>
                    <div class="date-picker-panel hidden" data-date-panel>
                        <div class="date-picker-header">
                            <button type="button" data-date-prev aria-label="Mês anterior">‹</button>
                            <span data-date-title></span>
                            <button type="button" data-date-next aria-label="Próximo mês">›</button>
                        </div>
                        <div class="date-picker-weekdays">
                            <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
                        </div>
                        <div class="date-picker-grid" data-date-grid></div>
                    </div>
                </div>
            </div>
            <div>
                <label class="form-label text-xs" for="edit_status_{{ txn.id }}">Status</label>
                <select name="status" id="edit_status_{{ txn.id }}" class="form-select w-full">
                    <option value="PENDING" {% if txn.status == 'PENDING' %}selected{% endif %}>Pendente</option>
                    <option value="PAID" {% if txn.status == 'PAID' %}selected{% endif %}>Pago</option>
                </select>
            </div>
        </div>

        <!-- Meta Vinculada -->
        <div>
            <label class="form-label text-xs" for="edit_goal_{{ txn.id }}">Meta Vinculada</label>
            <select name="goal" id="edit_goal_{{ txn.id }}" class="form-select w-full">
                <option value="">Sem meta</option>
                {% for goal in goals %}
                    <option value="{{ goal.id }}" {% if txn.goal_id == goal.id %}selected{% endif %}>{{ goal.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Financiado pela meta -->
        <div id="edit_funded_container_{{ txn.id }}" class="hidden">
            <label class="flex items-center gap-2 cursor-pointer group">
                <input type="checkbox" id="edit_funded_checkbox_{{ txn.id }}"
                       {% if txn.funded_by_goal %}checked{% endif %}
                       class="w-4 h-4 rounded border-white/20 bg-dark-800 text-amber-500 focus:ring-amber-500/30 cursor-pointer">
                <span class="text-xs text-gray-400 group-hover:text-gray-300 transition-colors">
                    💰 Financiado pela meta <span class="text-[10px] text-gray-600">(não afeta o fluxo de caixa)</span>
                </span>
            </label>
            <input type="hidden" name="funded_by_goal" id="edit_funded_hidden_{{ txn.id }}" value="{% if txn.funded_by_goal %}true{% else %}false{% endif %}">
        </div>

        <script>
            (function() {
                const txnId = "{{ txn.id }}";
                const typeSelect = document.getElementById('edit_type_' + txnId);
                const goalSelect = document.getElementById('edit_goal_' + txnId);
                const container = document.getElementById('edit_funded_container_' + txnId);
                const checkbox = document.getElementById('edit_funded_checkbox_' + txnId);
                const hiddenInput = document.getElementById('edit_funded_hidden_' + txnId);

                function update() {
                    if (!typeSelect || !goalSelect || !container || !checkbox || !hiddenInput) return;
                    const isExpense = typeSelect.value === 'EXPENSE';
                    const hasGoal = goalSelect.value !== '';

                    if (isExpense && hasGoal) {
                        container.classList.remove('hidden');
                    } else {
                        container.classList.add('hidden');
                        checkbox.checked = false;
                        hiddenInput.value = 'false';
                    }
                }

                if (typeSelect) typeSelect.addEventListener('change', update);
                if (goalSelect) goalSelect.addEventListener('change', update);
                if (checkbox) {
                    checkbox.addEventListener('change', function() {
                        if (hiddenInput) hiddenInput.value = checkbox.checked ? 'true' : 'false';
                    });
                }

                update();
            })();
        </script>

        <!-- Botões -->
        <div class="flex gap-2 pt-1">
            <button type="submit" class="btn btn-primary flex-1 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Salvar
            </button>
            <!-- Cancelar: busca a row original sem salvar -->
            <button type="button"
                    hx-get="{% url 'transaction_edit' txn.id %}"
                    hx-target="#txn-{{ txn.id }}"
                    hx-swap="outerHTML"
                    hx-vals='{"cancel": "1"}'
                    class="btn btn-ghost flex items-center justify-center gap-2 px-4">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                Cancelar
            </button>
        </div>
    </form>
</div>
