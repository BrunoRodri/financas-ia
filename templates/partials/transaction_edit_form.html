{% load currency_filters %}
<div id="txn-{{ txn.id }}" class="rounded-xl border border-accent/30 bg-dark-800/60 p-4 animate-fade-in-up">
    <form hx-post="{% url 'transaction_edit' txn.id %}"
          hx-target="#txn-{{ txn.id }}"
          hx-swap="outerHTML"
          class="space-y-3">
        {% csrf_token %}

        <!-- Descrição -->
        <div>
            <label class="form-label text-xs" for="edit_description_{{ txn.id }}">Descrição</label>
            <input type="text" name="description" id="edit_description_{{ txn.id }}"
                   value="{{ txn.description }}"
                   class="form-input w-full" required>
        </div>

        <!-- Valor + Tipo -->
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="form-label text-xs" for="edit_amount_{{ txn.id }}">Valor (R$)</label>
                <input type="number" name="amount" id="edit_amount_{{ txn.id }}"
                       value="{{ txn.amount|stringformat:'.2f' }}"
                       step="0.01" min="0.01"
                       class="form-input w-full" required>
            </div>
            <div>
                <label class="form-label text-xs" for="edit_type_{{ txn.id }}">Tipo</label>
                <select name="type" id="edit_type_{{ txn.id }}" class="form-select w-full">
                    <option value="INCOME" {% if txn.type == 'INCOME' %}selected{% endif %}>Entrada</option>
                    <option value="EXPENSE" {% if txn.type == 'EXPENSE' %}selected{% endif %}>Saída</option>
                </select>
            </div>
        </div>

        <!-- Data + Status -->
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="form-label text-xs" for="edit_due_date_{{ txn.id }}">Data</label>
                <div class="date-picker-wrap">
                    <input type="text" name="due_date" id="edit_due_date_{{ txn.id }}"
                           value="{{ txn.due_date|date:'d/m/Y' }}"
                           class="form-input w-full" autocomplete="off" inputmode="numeric" required>
                    <button type="button" class="date-picker-toggle" aria-label="Abrir calendário" data-date-toggle>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    </button>
                    <div class="date-picker-panel hidden" data-date-panel>
                        <div class="date-picker-header">
                            <button type="button" data-date-prev aria-label="Mês anterior">‹</button>
                            <span data-date-title></span>
                            <button type="button" data-date-next aria-label="Próximo mês">›</button>
                        </div>
                        <div class="date-picker-weekdays">
                            <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
                        </div>
                        <div class="date-picker-grid" data-date-grid></div>
                    </div>
                </div>
            </div>
            <div>
                <label class="form-label text-xs" for="edit_status_{{ txn.id }}">Status</label>
                <select name="status" id="edit_status_{{ txn.id }}" class="form-select w-full">
                    <option value="PENDING" {% if txn.status == 'PENDING' %}selected{% endif %}>Pendente</option>
                    <option value="PAID" {% if txn.status == 'PAID' %}selected{% endif %}>Pago</option>
                </select>
            </div>
        </div>

        <!-- Meta Vinculada -->
        <div>
            <label class="form-label text-xs" for="edit_goal_{{ txn.id }}">Meta Vinculada</label>
            <select name="goal" id="edit_goal_{{ txn.id }}" class="form-select w-full">
                <option value="">Sem meta</option>
                {% for goal in goals %}
                    <option value="{{ goal.id }}" {% if txn.goal_id == goal.id %}selected{% endif %}>{{ goal.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Tipo de Pagamento (Dinheiro/Pix vs. Cartão) -->
        <div id="edit-payment-type-container-{{ txn.id }}" class="hidden">
            <label class="form-label text-xs" for="edit_payment_type_{{ txn.id }}">Tipo de Pagamento</label>
            <select name="payment_type" id="edit_payment_type_{{ txn.id }}" class="form-select w-full">
                <option value="other" {% if form.payment_type.value == 'other' or not txn.credit_card %}selected{% endif %}>Dinheiro / Pix / Débito</option>
                <option value="card" {% if form.payment_type.value == 'card' or txn.credit_card %}selected{% endif %}>Cartão de Crédito</option>
            </select>
        </div>

        <!-- Cartão -->
        <div id="edit-credit-card-container-{{ txn.id }}" class="hidden">
            <label class="form-label text-xs" for="edit_credit_card_{{ txn.id }}">Cartão</label>
            <select name="credit_card" id="edit_credit_card_{{ txn.id }}" class="form-select w-full">
                <option value="">Sem cartão</option>
                {% for c in form.fields.credit_card.queryset %}
                    <option value="{{ c.id }}" {% if txn.credit_card_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Tags -->
        {% if form.fields.tags.queryset.exists %}
        <div>
            <label class="form-label text-xs">Tags</label>
            <div class="flex flex-wrap gap-2">
                {% for tag in form.fields.tags.queryset %}
                    <div class="tag-checkbox">
                        <input type="checkbox" name="tags" id="edit_tag_{{ tag.id }}_{{ txn.id }}" value="{{ tag.id }}"
                               {% if tag in txn.tags.all %}checked{% endif %}>
                        <label for="edit_tag_{{ tag.id }}_{{ txn.id }}">{{ tag.name }}</label>
                    </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <script>
            (function() {
                const txnId = "{{ txn.id }}";
                const typeField = document.getElementById(`edit_type_${txnId}`);
                const paymentTypeField = document.getElementById(`edit_payment_type_${txnId}`);
                const creditCardField = document.getElementById(`edit_credit_card_${txnId}`);
                const paymentTypeContainer = document.getElementById(`edit-payment-type-container-${txnId}`);
                const creditCardContainer = document.getElementById(`edit-credit-card-container-${txnId}`);
                
                function updateEditFields() {
                    if (!typeField || !paymentTypeField || !creditCardField || !paymentTypeContainer || !creditCardContainer) return;
                    
                    const isExpense = typeField.value === 'EXPENSE';
                    const isCard = paymentTypeField.value === 'card';
                    
                    if (isExpense) {
                        paymentTypeContainer.classList.remove('hidden');
                        paymentTypeField.disabled = false;
                        if (isCard) {
                            creditCardContainer.classList.remove('hidden');
                            creditCardField.disabled = false;
                        } else {
                            creditCardContainer.classList.add('hidden');
                            creditCardField.value = '';
                            creditCardField.disabled = true;
                        }
                    } else {
                        paymentTypeContainer.classList.add('hidden');
                        creditCardContainer.classList.add('hidden');
                        paymentTypeField.value = 'other';
                        paymentTypeField.disabled = true;
                        creditCardField.value = '';
                        creditCardField.disabled = true;
                    }
                }
                
                if (typeField) typeField.addEventListener('change', updateEditFields);
                if (paymentTypeField) paymentTypeField.addEventListener('change', updateEditFields);
                
                updateEditFields();
            })();
        </script>



        <!-- Botões -->
        <div class="flex gap-2 pt-1">
            <button type="submit" class="btn btn-primary flex-1 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Salvar
            </button>
            <!-- Cancelar: busca a row original sem salvar -->
            <button type="button"
                    hx-get="{% url 'transaction_edit' txn.id %}"
                    hx-target="#txn-{{ txn.id }}"
                    hx-swap="outerHTML"
                    hx-vals='{"cancel": "1"}'
                    class="btn btn-ghost flex items-center justify-center gap-2 px-4">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                Cancelar
            </button>
        </div>
    </form>
</div>
