{% load currency_filters %}
<div class="flex items-center gap-3 p-3 rounded-xl bg-primary-500/5 border border-primary-500/10 hover:bg-primary-500/10 transition-colors group">
    <!-- Icon Placeholder -->
    <div class="flex-shrink-0 w-5 h-5 rounded-full bg-primary-500/10 flex items-center justify-center border border-primary-500/20 text-primary-400">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
    </div>

    <!-- Info -->
    <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
            <span class="text-sm font-semibold text-white truncate">
                {{ txn.description }}
            </span>
            <span class="text-[9px] uppercase tracking-wider font-semibold px-1.5 py-0.5 rounded bg-primary-500/10 text-primary-400 border border-primary-500/20">
                Ajuste
            </span>
        </div>
        <div class="flex items-center gap-2 mt-0.5">
            <span class="text-xs text-gray-500">{{ txn.due_date|date:"d/m/Y" }}</span>
        </div>
    </div>

    <!-- Amount -->
    <div class="flex-shrink-0 text-right mr-2">
        <span class="text-sm font-semibold text-gray-200">
            {{ txn.amount|brl }}
        </span>
    </div>

    <!-- Quick edit settings shortcut -->
    <a href="{% url 'settings' %}"
       class="flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity p-1 rounded-lg hover:bg-primary-500/10 text-gray-500 hover:text-primary-400"
       title="Ajustar nas Configurações">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
    </a>
</div>
