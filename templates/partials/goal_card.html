{% load currency_filters %}
<div class="p-4 rounded-xl bg-dark-700/50 border border-white/5 {% if is_new %}new-row{% endif %}">
    <div class="flex items-start justify-between mb-3">
        <div>
            <h3 class="text-sm font-semibold text-white">{{ goal.name }}</h3>
            <p class="text-xs text-gray-500 mt-0.5">Meta até {{ goal.deadline|date:"d/m/Y" }}</p>
        </div>
        <button hx-post="{% url 'goal_delete' goal.id %}"
                hx-target="closest div"
                hx-swap="outerHTML"
                hx-confirm="Excluir esta meta?"
                class="p-1 rounded-lg hover:bg-red-500/10 text-gray-600 hover:text-red-400 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar mb-2">
        <div class="progress-fill" style="--width: {{ goal.progress_percent }}%; --bg: {{ goal.color }}; width: var(--width); background: var(--bg);"></div>
    </div>

    <div class="flex items-center justify-between">
        <span class="text-xs text-gray-400">{{ goal.current_amount|brl }} de {{ goal.target_amount|brl }}</span>
        <span class="text-xs font-semibold" style="--text-color: {{ goal.color }}; color: var(--text-color);">{{ goal.progress_percent|percentage }}</span>
    </div>
</div>
