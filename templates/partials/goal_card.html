{% load currency_filters %}
<div id="goal-card-{{ goal.id }}" class="p-4 rounded-xl bg-dark-700/50 border border-white/5 {% if is_new %}new-row{% endif %}">
    <div class="flex items-start justify-between mb-3">
        <div>
            <h3 class="text-sm font-semibold text-white">{{ goal.name }}</h3>
            <p class="text-xs text-gray-500 mt-0.5">Meta até {{ goal.deadline|date:"d/m/Y" }}</p>
        </div>
        <button hx-get="{% url 'goal_delete_confirm' goal.id %}"
                hx-target="#global-modal"
                class="p-1 rounded-lg hover:bg-red-500/10 text-gray-600 hover:text-red-400 transition-colors cursor-pointer"
                title="Excluir meta">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar mb-2">
        <div class="progress-fill" style="--width: {{ goal.progress_percent|floatformat:"0" }}%; --bg: {{ goal.color }}; width: var(--width); background: var(--bg);"></div>
    </div>

    <div class="flex items-center justify-between mb-3">
        <span class="text-xs text-gray-400">{{ goal.current_amount|brl }} de {{ goal.target_amount|brl }}</span>
        <span class="text-xs font-semibold" style="--text-color: {{ goal.color }}; color: var(--text-color);">{{ goal.progress_percent|percentage }}</span>
    </div>

    <div class="divider !my-2"></div>

    <!-- Quick Actions -->
    <div class="flex gap-2">
        <button hx-get="{% url 'goal_edit' goal.id %}?type=add"
                hx-target="closest div.p-4"
                hx-swap="outerHTML"
                class="flex-1 py-1.5 px-2 text-[10px] font-bold rounded-lg border border-emerald-500/20 hover:border-emerald-500/50 bg-emerald-500/5 hover:bg-emerald-500/10 text-emerald-400 transition-all flex items-center justify-center gap-1 cursor-pointer">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
            Guardar
        </button>
        <button hx-get="{% url 'goal_edit' goal.id %}?type=subtract"
                hx-target="closest div.p-4"
                hx-swap="outerHTML"
                class="flex-1 py-1.5 px-2 text-[10px] font-bold rounded-lg border border-red-500/20 hover:border-red-500/50 bg-red-500/5 hover:bg-red-500/10 text-red-400 transition-all flex items-center justify-center gap-1 cursor-pointer">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/></svg>
            Resgatar
        </button>
    </div>
</div>
