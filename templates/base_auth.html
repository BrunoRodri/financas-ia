<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finança{% endblock %} | Previsão Financeira</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        dark: { 900: '#0a0e1a', 800: '#0f1629', 700: '#161d35' },
                        accent: { DEFAULT: '#6366f1', light: '#818cf8' },
                    }
                }
            }
        }
    </script>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/custom.css' %}?v=5">
</head>
<body class="bg-dark-900 text-gray-100 font-sans antialiased min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-4">
        <!-- Logo -->
        <div class="flex justify-center mb-8">
            <a href="/" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-accent flex items-center justify-center">
                    <svg class="w-5 h-5 text-dark-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                    </svg>
                </div>
                <span class="text-xl font-bold text-white">Finança</span>
            </a>
        </div>

        <!-- Card -->
        <div class="bg-dark-800 border border-dark-700 rounded-2xl p-8 shadow-2xl">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
