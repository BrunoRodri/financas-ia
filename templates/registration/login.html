{% extends 'base_auth.html' %}
{% block title %}Entrar{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-white mb-1">Bem-vindo de volta</h1>
<p class="text-sm text-gray-400 mb-6">Entre na sua conta para continuar</p>

<form method="post" class="space-y-4">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

    <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5" for="id_username">Usuário</label>
        <input type="text" name="username" id="id_username" autofocus required
               class="w-full px-4 py-2.5 rounded-xl bg-dark-900/60 border border-white/10 text-white placeholder-gray-600 focus:outline-none focus:border-accent/60 focus:ring-1 focus:ring-accent/30 transition text-sm"
               placeholder="Seu nome de usuário">
    </div>

    <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5" for="id_password">Senha</label>
        <input type="password" name="password" id="id_password" required
               class="w-full px-4 py-2.5 rounded-xl bg-dark-900/60 border border-white/10 text-white placeholder-gray-600 focus:outline-none focus:border-accent/60 focus:ring-1 focus:ring-accent/30 transition text-sm"
               placeholder="Sua senha">
    </div>

    {% if form.errors %}
    <p class="text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2">
        Usuário ou senha incorretos.
    </p>
    {% endif %}

    <button type="submit"
            class="w-full py-2.5 rounded-xl text-sm font-semibold bg-accent hover:bg-accent-light text-white transition-all shadow-md shadow-accent/20 active:scale-[0.98]">
        Entrar
    </button>
</form>

<p class="text-center text-sm text-gray-500 mt-6">
    Não tem conta?
    <a href="{% url 'signup' %}" class="text-accent-light hover:text-white transition-colors font-medium">Cadastre-se</a>
</p>
{% endblock %}
